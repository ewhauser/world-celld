name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version for recovering an existing release
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Open release PRs and create draft releases.
      issues: write # Apply Release Please labels.
      pull-requests: write # Open and update the release PR.
    outputs:
      release: ${{ steps.metadata.outputs.release }}
      pr_branch: ${{ steps.metadata.outputs.pr_branch }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      tarball: ${{ steps.metadata.outputs.tarball }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - name: Create release
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check current release tag
        id: current_release
        if: github.event_name == 'push' && steps.release.outputs.release_created != 'true'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';

          const packageManifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const releaseManifest = JSON.parse(readFileSync('.release-please-manifest.json', 'utf8'));
          if (packageManifest.version !== releaseManifest['.']) {
            throw new Error(
              `package version ${packageManifest.version} does not match release manifest ${releaseManifest['.']}`,
            );
          }
          const tag = `v${packageManifest.version}`;
          const remoteTags = execFileSync('git', [
            'ls-remote',
            `https://github.com/${process.env.GH_REPO}.git`,
            `refs/tags/${tag}`,
            `refs/tags/${tag}^{}`,
          ], { encoding: 'utf8' }).trim();
          appendFileSync(process.env.GITHUB_OUTPUT, `tag_exists=${remoteTags ? 'true' : 'false'}\n`);
          EOF
      - name: Create or update release PR
        id: release_pr
        if: >-
          github.event_name == 'push' &&
          steps.release.outputs.release_created != 'true' &&
          steps.current_release.outputs.tag_exists == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      - name: Resolve release metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.version }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_PR: ${{ steps.release_pr.outputs.pr }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync, spawnSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';

          const semver = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/;
          const commit = /^[0-9a-f]{40}$/;
          const outputs = {
            release: 'false',
            pr_branch: '',
            version: '',
            tag: '',
            tarball: '',
            sha: '',
          };

          if (process.env.RELEASE_PR) {
            const pullRequest = JSON.parse(process.env.RELEASE_PR);
            if (pullRequest.baseBranchName !== 'main') {
              throw new Error(`unexpected release PR base: ${pullRequest.baseBranchName}`);
            }
            if (!pullRequest.headBranchName || /[\r\n]/.test(pullRequest.headBranchName)) {
              throw new Error('invalid release PR branch');
            }
            outputs.pr_branch = pullRequest.headBranchName;
          }

          if (process.env.EVENT_NAME === 'push') {
            if (process.env.RELEASE_CREATED === 'true') {
              outputs.release = 'true';
              outputs.version = process.env.RELEASE_VERSION;
              outputs.tag = process.env.RELEASE_TAG;
              outputs.sha = process.env.RELEASE_SHA;
            }
          } else if (process.env.EVENT_NAME === 'workflow_dispatch') {
            if (process.env.WORKFLOW_REF !== 'refs/heads/main') {
              throw new Error('manual recovery must run from main');
            }
            outputs.release = 'true';
            outputs.version = process.env.MANUAL_VERSION;
            outputs.tag = `v${outputs.version}`;
            outputs.sha = process.env.WORKFLOW_SHA;

            const remoteTags = execFileSync('git', [
              'ls-remote',
              `https://github.com/${process.env.GH_REPO}.git`,
              `refs/tags/${outputs.tag}`,
              `refs/tags/${outputs.tag}^{}`,
            ], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
            if (remoteTags.length > 0) {
              const peeled = remoteTags.find(line => line.endsWith('^{}'));
              outputs.sha = (peeled ?? remoteTags[0]).split('\t')[0];
            }

            const response = spawnSync('gh', [
              'api',
              `repos/${process.env.GH_REPO}/releases/tags/${outputs.tag}`,
            ], { encoding: 'utf8' });
            if (response.status === 0) {
              const release = JSON.parse(response.stdout);
              if (remoteTags.length === 0) {
                const target = release.target_commitish;
                if (commit.test(target)) {
                  outputs.sha = target;
                } else {
                  const resolved = JSON.parse(execFileSync('gh', [
                    'api',
                    `repos/${process.env.GH_REPO}/commits/${target}`,
                  ], { encoding: 'utf8' }));
                  outputs.sha = resolved.sha;
                }
              }
            } else if (!response.stderr.includes('HTTP 404')) {
              throw new Error(`could not inspect an existing release: ${response.stderr.trim()}`);
            }
          } else {
            throw new Error(`unsupported event: ${process.env.EVENT_NAME}`);
          }

          if (outputs.release === 'true') {
            if (!semver.test(outputs.version)) {
              throw new Error(`invalid semantic version: ${outputs.version}`);
            }
            if (outputs.tag !== `v${outputs.version}`) {
              throw new Error(`unexpected tag: ${outputs.tag}`);
            }
            if (!commit.test(outputs.sha)) {
              throw new Error(`invalid release commit: ${outputs.sha}`);
            }
            if (process.env.EVENT_NAME === 'push' && outputs.sha !== process.env.WORKFLOW_SHA) {
              throw new Error('Release Please targeted a commit other than this main push');
            }
            outputs.tarball = `ewhauser-world-celld-${outputs.version}.tgz`;
          }

          appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(outputs)
            .map(([key, value]) => `${key}=${value}`)
            .join('\n') + '\n');
          EOF

  check-release-pr:
    name: Start release PR checks
    needs: prepare
    if: needs.prepare.outputs.pr_branch != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # Dispatch CI for the Release Please branch without a PAT.
    steps:
      - name: Run CI on release PR branch
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_BRANCH: ${{ needs.prepare.outputs.pr_branch }}
        run: |
          gh api --method POST \
            "repos/$GH_REPO/actions/workflows/ci.yml/dispatches" \
            -f "ref=$RELEASE_PR_BRANCH"

  build:
    name: Build release artifact
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: true
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
      tarball: ${{ steps.package.outputs.tarball }}
      sha: ${{ steps.package.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install
          pnpm --version
      - name: Validate release version
        id: package
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          const packageManifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const releaseManifest = JSON.parse(readFileSync('.release-please-manifest.json', 'utf8'));
          const requested = process.env.RELEASE_VERSION;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(requested)) {
            throw new Error(`invalid semantic version: ${requested}`);
          }
          if (packageManifest.version !== requested) {
            throw new Error(`package.json is ${packageManifest.version}, requested ${requested}`);
          }
          if (releaseManifest['.'] !== requested) {
            throw new Error(`release manifest is ${releaseManifest['.']}, requested ${requested}`);
          }
          const checkedOut = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (checkedOut !== process.env.RELEASE_SHA) {
            throw new Error(`checked out ${checkedOut}, expected ${process.env.RELEASE_SHA}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, [
            `version=${requested}`,
            `tag=v${requested}`,
            `tarball=ewhauser-world-celld-${requested}.tgz`,
            `sha=${process.env.RELEASE_SHA}`,
            '',
          ].join('\n'));
          EOF
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source and package
        run: pnpm check
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Build release artifact
        run: pnpm pack:release
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ steps.package.outputs.version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing via OIDC
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TARBALL: ${{ needs.build.outputs.tarball }}
    outputs:
      integrity: ${{ steps.publish.outputs.integrity }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ needs.build.outputs.version }}
          path: release-artifacts
      - name: Verify and describe package
        id: package
        run: |
          (cd release-artifacts && sha256sum --check "$RELEASE_TARBALL.sha256")
          node --input-type=module <<'EOF'
          import { appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const tarball = `./release-artifacts/${process.env.RELEASE_TARBALL}`;
          const npmVersion = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = npmVersion.split('.').map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error(`npm ${npmVersion} does not support trusted publishing`);
          }
          const [pack] = JSON.parse(execFileSync('npm', ['pack', tarball, '--json', '--dry-run', '--ignore-scripts'], { encoding: 'utf8' }));
          if (pack.name !== '@ewhauser/world-celld' || pack.version !== process.env.RELEASE_VERSION) {
            throw new Error(`unexpected package: ${pack.name}@${pack.version}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `built_integrity=${pack.integrity}\n`);
          EOF
      - name: Publish package with trusted publishing
        id: publish
        env:
          BUILT_INTEGRITY: ${{ steps.package.outputs.built_integrity }}
        run: |
          if REGISTRY_INTEGRITY=$(npm view "@ewhauser/world-celld@$RELEASE_VERSION" dist.integrity 2>/dev/null); then
            if test "$REGISTRY_INTEGRITY" != "$BUILT_INTEGRITY"; then
              # npm and zlib versions can encode identical tar streams into
              # different gzip bytes. Compare the complete package tar stream
              # before accepting an existing bootstrap version.
              READBACK_DIRECTORY=$(mktemp -d)
              npm pack "@ewhauser/world-celld@$RELEASE_VERSION" \
                --json \
                --ignore-scripts \
                --pack-destination "$READBACK_DIRECTORY" >/dev/null
              cmp \
                <(gzip -dc "./release-artifacts/$RELEASE_TARBALL") \
                <(gzip -dc "$READBACK_DIRECTORY/$RELEASE_TARBALL")
            fi
            RELEASE_INTEGRITY=$REGISTRY_INTEGRITY
            echo "Registry already contains the identical package contents."
          else
            npm publish "./release-artifacts/$RELEASE_TARBALL" --access public --ignore-scripts
            RELEASE_INTEGRITY=$BUILT_INTEGRITY
          fi
          echo "integrity=$RELEASE_INTEGRITY" >> "$GITHUB_OUTPUT"
      - name: Verify registry integrity
        env:
          EXPECTED_INTEGRITY: ${{ steps.publish.outputs.integrity }}
        run: |
          for _ in {1..24}; do
            if REGISTRY_INTEGRITY=$(npm view "@ewhauser/world-celld@$RELEASE_VERSION" dist.integrity 2>/dev/null) && \
              test "$REGISTRY_INTEGRITY" = "$EXPECTED_INTEGRITY"; then
              exit 0
            fi
            sleep 5
          done
          echo "npm registry did not expose the expected integrity within two minutes" >&2
          exit 1
      - name: Read back canonical registry package
        env:
          EXPECTED_INTEGRITY: ${{ steps.publish.outputs.integrity }}
        run: |
          mkdir registry-artifacts
          npm pack "@ewhauser/world-celld@$RELEASE_VERSION" \
            --json \
            --ignore-scripts \
            --pack-destination registry-artifacts > registry-pack.json
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const [pack] = JSON.parse(readFileSync('registry-pack.json', 'utf8'));
          if (pack.filename !== process.env.RELEASE_TARBALL) {
            throw new Error(`unexpected registry tarball: ${pack.filename}`);
          }
          if (pack.integrity !== process.env.EXPECTED_INTEGRITY) {
            throw new Error(`unexpected registry integrity: ${pack.integrity}`);
          }
          EOF
          cmp \
            <(gzip -dc "./release-artifacts/$RELEASE_TARBALL") \
            <(gzip -dc "./registry-artifacts/$RELEASE_TARBALL")
          (cd registry-artifacts && sha256sum "$RELEASE_TARBALL" > "$RELEASE_TARBALL.sha256")
      - name: Upload canonical registry package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-verified-${{ needs.build.outputs.version }}
          path: registry-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  finalize:
    name: Publish GitHub release
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Create the release tag and attach the verified artifact.
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_INTEGRITY: ${{ needs.publish.outputs.integrity }}
      RELEASE_SHA: ${{ needs.build.outputs.sha }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_TARBALL: ${{ needs.build.outputs.tarball }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-verified-${{ needs.build.outputs.version }}
          path: release-artifacts
      - name: Verify artifact and registry
        run: |
          cd release-artifacts
          sha256sum --check "$RELEASE_TARBALL.sha256"
          test "$(npm view "@ewhauser/world-celld@$RELEASE_VERSION" dist.integrity)" = "$RELEASE_INTEGRITY"
      - name: Create or finish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_OBJECT=$(git ls-remote "https://github.com/$GH_REPO.git" "refs/tags/$RELEASE_TAG" | cut -f1)
          TAG_COMMIT=$(git ls-remote "https://github.com/$GH_REPO.git" "refs/tags/$RELEASE_TAG^{}" | cut -f1)
          TAG_SHA=${TAG_COMMIT:-$TAG_OBJECT}
          if test -n "$TAG_SHA"; then
            test "$TAG_SHA" = "$RELEASE_SHA"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true; then
              gh release upload "$RELEASE_TAG" \
                "release-artifacts/$RELEASE_TARBALL" \
                "release-artifacts/$RELEASE_TARBALL.sha256" \
                --clobber
              gh release edit "$RELEASE_TAG" --draft=false
            else
              DOWNLOAD_DIRECTORY=$(mktemp -d)
              gh release download "$RELEASE_TAG" \
                --dir "$DOWNLOAD_DIRECTORY" \
                --pattern "$RELEASE_TARBALL" \
                --pattern "$RELEASE_TARBALL.sha256"
              cmp "release-artifacts/$RELEASE_TARBALL" "$DOWNLOAD_DIRECTORY/$RELEASE_TARBALL"
              cmp "release-artifacts/$RELEASE_TARBALL.sha256" "$DOWNLOAD_DIRECTORY/$RELEASE_TARBALL.sha256"
            fi
          else
            gh release create "$RELEASE_TAG" \
              "release-artifacts/$RELEASE_TARBALL" \
              "release-artifacts/$RELEASE_TARBALL.sha256" \
              --draft \
              --generate-notes \
              --target "$RELEASE_SHA" \
              --title "world-celld $RELEASE_VERSION"
            gh release edit "$RELEASE_TAG" --draft=false
          fi
